# XcodeGen spec (owner: I1 Scaffold & CI). Generate with `xcodegen generate`; OnePass.xcodeproj is git-ignored.
name: OnePass

options:
  bundleIdPrefix: io.github.rkceve
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: ios/Config/Base.xcconfig
  Release: ios/Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  OnePassCore:
    path: ios/OnePassCore
  OnePassUI:
    path: ios/OnePassUI
  RevenueCat:
    # https://github.com/RevenueCat/purchases-ios/releases/tag/5.91.0 (latest release on 2026-09-23)
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: 5.91.0

targets:
  OnePass:
    type: application
    platform: iOS
    sources:
      - path: ios/App
        excludes:
          - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.onepass
        PRODUCT_NAME: OnePass
        INFOPLIST_FILE: ios/Config/OnePass-Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Config/OnePass.entitlements
    dependencies:
      - package: OnePassCore
        product: OnePassModels
      - package: OnePassCore
        product: OnePassStorage
      - package: OnePassCore
        product: OnePassMail
      - package: OnePassCore
        product: OnePassAuth
      - package: OnePassCore
        product: OnePassAuthUI
      - package: OnePassCore
        product: OnePassExtraction
      - package: OnePassCore
        product: OnePassServerClient
      - package: OnePassUI
        product: OnePassUI
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - target: OnePassAutoFill
        embed: true

  OnePassAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Extension
        excludes:
          - Info.plist
          - "*.entitlements"
          - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.onepass.autofill
        PRODUCT_NAME: OnePassAutoFill
        INFOPLIST_FILE: ios/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Extension/OnePassAutoFill.entitlements
    dependencies:
      - package: OnePassCore
        product: OnePassModels
      - package: OnePassCore
        product: OnePassStorage
      - package: OnePassCore
        product: OnePassMail
      - package: OnePassCore
        product: OnePassAuth
      - package: OnePassCore
        product: OnePassExtraction
      - package: OnePassCore
        product: OnePassServerClient
      - sdk: AuthenticationServices.framework

  # Unit tests for AppModel (ios/App/Tests), hosted in the app.
  OnePassAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/App/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.onepass.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ONEPASS_APP_TESTS"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OnePass.app/OnePass
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: OnePass
      - package: OnePassCore
        product: OnePassModels
      - package: OnePassUI
        product: OnePassUI

  # Unit tests for the extension's UI-free resolver; compiles the resolver sources directly (no host).
  OnePassExtensionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/Extension/Resolver
      - path: ios/Extension/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.onepass.extensiontests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: OnePassCore
        product: OnePassModels

  # CI probe (not shipped): verifies OTP AutoFill from a third-party provider in the Simulator.
  OnePassProbe:
    type: application
    platform: iOS
    sources:
      - path: ios/Probe/App
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ios/Probe/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.onepass.probe
        PRODUCT_NAME: OnePassProbe
        INFOPLIST_FILE: ios/Probe/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Probe/App/OnePassProbe.entitlements
    dependencies:
      - target: OnePassProbeAutoFill
        embed: true

  OnePassProbeAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Probe/AutoFill
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ios/Probe/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.onepass.probe.autofill
        PRODUCT_NAME: OnePassProbeAutoFill
        INFOPLIST_FILE: ios/Probe/AutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Probe/AutoFill/OnePassProbeAutoFill.entitlements
    dependencies:
      - sdk: AuthenticationServices.framework

  OnePassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.onepass.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OnePassProbe
    dependencies:
      - target: OnePassProbe

schemes:
  OnePass:
    build:
      targets:
        OnePass: all
        OnePassAutoFill: all
    test:
      targets:
        - OnePassAppTests
  OnePassExtensionTests:
    build:
      targets:
        OnePassExtensionTests: [test]
    test:
      targets:
        - OnePassExtensionTests
  # UI tour recording (.github/workflows/tour.yml): builds the OnePass app (installed onto the
  # simulator by the workflow) and OnePassUITests, whose UITourTests drives the OnePass app.
  OnePassTour:
    build:
      targets:
        OnePass: all
        OnePassAutoFill: all
        OnePassUITests: [test]
    test:
      targets:
        - OnePassUITests
  OnePassProbe:
    build:
      targets:
        OnePassProbe: all
        OnePassProbeAutoFill: all
    test:
      targets:
        - OnePassUITests
